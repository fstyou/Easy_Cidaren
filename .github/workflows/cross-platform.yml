name: Cross-platform checks

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Check GUI and language model imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PyQt6.QtWidgets import QApplication; from PyQt6.QtMultimedia import QSoundEffect; import spacy; app = QApplication([]); spacy.load('en_core_web_sm')"
