name: Cross-platform checks

on: [ push, pull_request ]

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ windows-latest, macos-latest, ubuntu-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -
                uses: actions/checkout@v4
            -
                uses: actions/setup-python@v5
                with:
                    python-version: '3.12'
            -
                name: Install Linux Qt runtime libraries
                if: runner.os == 'Linux'
                run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
            -
                run: python -m pip install -r requirements.txt
            -
                run: python -m pip check
            -
                run: python -m unittest discover -s tests -v
            -
                name: Exercise the main window
                env:
                    QT_QPA_PLATFORM: offscreen
                    PYTHONFAULTHANDLER: '1'
                run: python -u tests/gui_smoke.py
            -
                name: Check GUI and language model imports
                env:
                    QT_QPA_PLATFORM: offscreen
                run: python -c "from PyQt6.QtWidgets import QApplication; from PyQt6.QtMultimedia import QSoundEffect; import spacy; import main; from easy_cidaren.paths import MODEL_DIR; app = QApplication([]); spacy.load(MODEL_DIR)"
